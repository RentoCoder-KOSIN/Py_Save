[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py_save"
version = "1.0.0"
description = "Pythonのゲーム向けセーブデータ管理ライブラリ"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "RentoCoder-KOSIN", email = "konosiniti@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pygame>=2.0.0",
]

[project.scripts]
py_save = "py_save.main:main"

[tool.setuptools.packages.find]
include = ["py_save*"]

[tool.setuptools.package-data]
"py_save" = ["fonts/*.ttf", "fonts/*.ttc", "data/*.json"]
